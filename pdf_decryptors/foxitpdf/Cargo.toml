[package]
name = "foxit-decrypt"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
cbc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
lopdf = "0.44"
rayon = "1"
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
